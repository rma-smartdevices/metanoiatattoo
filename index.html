      .profile-banner {

        width: 100%;
        height: 220px;
        overflow: hidden; /* Keeps the banner flush with the top of the page */
        margin: 0;
        padding: 0;
        background-color: #160d14;
      } /* * Blurred banner image * * Using a pseudo-element keeps the actual banner image * separate from the overlay effects. */
      .profile-banner::before {
        content: "";
        position: absolute;
        inset: -12px;
        background-image: url("/img/banner.jpg");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;

        transform: scale(1.03);
        z-index: 0;

          ellipse at center,

        pointer-events: none;
        z-index: 1;

      .profile-banner img {

      .profile-banner {

         * Bokeh effect:

        filter: blur(8px);

        /*
         * Slightly enlarge the image so the blur doesn't

        transform: scale(1.08);
